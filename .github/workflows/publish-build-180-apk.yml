name: Publish Build 180 APK

on:
  push:
    paths:
      - '.github/workflows/publish-build-180-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download Build 180 APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10098823418/zip"
          rm -f FluentX-build-180.apk

          # Build #180 used actions/upload-artifact with archive:false, so the
          # artifact download endpoint returns the APK bytes directly even
          # though the REST endpoint path ends in /zip.
          for attempt in $(seq 1 12); do
            echo "Download attempt ${attempt}/12"
            if curl \
              --location \
              --fail-with-body \
              --silent --show-error \
              --connect-timeout 30 \
              --max-time 600 \
              --retry 4 \
              --retry-delay 2 \
              --retry-all-errors \
              --continue-at - \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o FluentX-build-180.apk \
              "$API_URL"; then
              break
            fi
            sleep 3
          done

          test -s FluentX-build-180.apk
          unzip -t FluentX-build-180.apk >/dev/null
          ls -lh FluentX-build-180.apk

      - name: Verify APK digest
        run: |
          set -euo pipefail
          ACTUAL="$(sha256sum FluentX-build-180.apk | awk '{print $1}')"
          EXPECTED="45f8e5d9032e40912fb1203333ad066426ebc4e06bbdbdb3b495dcdc5bd9e538"
          echo "actual_sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Publish direct APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="fluentx-build-180"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" FluentX-build-180.apk --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" FluentX-build-180.apk \
              --repo "${{ github.repository }}" \
              --target "cdb3120e1e284c9747c2e5effaf19754df948ce3" \
              --title "Fluent X Build #180" \
              --notes "Direct debug APK from successful workflow run 34337994817. SHA-256: 45f8e5d9032e40912fb1203333ad066426ebc4e06bbdbdb3b495dcdc5bd9e538"
          fi
