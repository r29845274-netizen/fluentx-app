name: Publish Build 180 APK

on:
  push:
    paths:
      - '.github/workflows/publish-build-180-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download Build 180 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/${{ github.repository }}/actions/artifacts/10098823418/zip > build-180.zip
          mkdir extracted
          unzip -q build-180.zip -d extracted
          APK_PATH="$(find extracted -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" FluentX-build-180.apk
          ls -lh FluentX-build-180.apk
          sha256sum FluentX-build-180.apk

      - name: Publish direct APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="fluentx-build-180"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" FluentX-build-180.apk --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" FluentX-build-180.apk \
              --repo "${{ github.repository }}" \
              --title "Fluent X Build #180" \
              --notes "Latest successful debug APK from workflow run 34337994817 (commit cdb3120e1e284c9747c2e5effaf19754df948ce3)."
          fi
