name: Publish Build 180 APK

on:
  push:
    paths:
      - '.github/workflows/publish-build-180-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download Build 180 artifact with resilient curl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/${{ github.repository }}/actions/artifacts/10098823418/zip"
          rm -f build-180.zip

          # GitHub's normal download-artifact action failed repeatedly on this
          # ~179 MB artifact. Use curl with resumable retries instead.
          for attempt in $(seq 1 12); do
            echo "Download attempt ${attempt}/12"
            if curl \
              --location \
              --fail-with-body \
              --silent --show-error \
              --connect-timeout 30 \
              --max-time 600 \
              --retry 4 \
              --retry-delay 2 \
              --retry-all-errors \
              --continue-at - \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o build-180.zip \
              "$API_URL"; then
              break
            fi
            sleep 3
          done

          test -s build-180.zip
          unzip -t build-180.zip
          mkdir -p extracted
          unzip -q build-180.zip -d extracted

      - name: Prepare APK
        run: |
          set -euo pipefail
          APK_PATH="$(find extracted -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" FluentX-build-180.apk
          test -s FluentX-build-180.apk
          ls -lh FluentX-build-180.apk
          echo "sha256=$(sha256sum FluentX-build-180.apk | awk '{print $1}')"

      - name: Publish direct APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="fluentx-build-180"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" FluentX-build-180.apk --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG" FluentX-build-180.apk \
              --repo "${{ github.repository }}" \
              --target "cdb3120e1e284c9747c2e5effaf19754df948ce3" \
              --title "Fluent X Build #180" \
              --notes "Direct debug APK from successful workflow run 34337994817. SHA-256: 45f8e5d9032e40912fb1203333ad066426ebc4e06bbdbdb3b495dcdc5bd9e538"
          fi
