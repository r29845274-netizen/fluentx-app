name: FluentX Owner Setup Readiness
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/owner-setup-readiness.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify owner bootstrap server configuration
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          code="$(curl -sS -o "$response_file" -w '%{http_code}' -X POST             https://rdrvqszejpupaqeitmmu.supabase.co/functions/v1/owner-bootstrap-status)"
          if [ "$code" = "404" ]; then
            echo "OWNER_SETUP_STATUS=already_claimed"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "Unexpected owner bootstrap status HTTP $code"
            cat "$response_file"
            exit 1
          fi
          python3 - "$response_file" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          if data.get('configuration_missing') is True:
              raise SystemExit('OWNER_EMAIL is not configured in the Edge Function environment')
          if data.get('setup_required') is not True:
              raise SystemExit('Owner setup is neither claimed nor ready')
          print('OWNER_SETUP_STATUS=ready')
          PY
