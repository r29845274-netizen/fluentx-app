name: Inspect Staged Latest Source

on:
  push:
    paths:
      - '.github/workflows/export-base-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Inspect staged source archives
        shell: bash
        run: |
          set -u

          cat .fluentx/latest_overlay/part*.b64 > /tmp/overlay.b64
          base64 --decode /tmp/overlay.b64 > /tmp/overlay.tar.gz
          echo "=== CLIENT OVERLAY ==="
          wc -c /tmp/overlay.b64 /tmp/overlay.tar.gz
          sha256sum /tmp/overlay.tar.gz
          tar -tzf /tmp/overlay.tar.gz | head -80 || true

          cat .source_handoff/2026-09-26-latest/part_*.b64 > /tmp/latest.b64
          echo "=== LATEST HANDOFF ==="
          wc -c /tmp/latest.b64
          set +e
          base64 --decode /tmp/latest.b64 > /tmp/latest.tar.xz
          rc=$?
          set -e
          echo "decode_rc=$rc"\n          echo "=== CANDIDATE DROP FIRST CHAR OF PART 07 ==="\n          cat .source_handoff/2026-09-26-latest/part_0[0-6].b64 > /tmp/candidate.b64\n          tail -c +2 .source_handoff/2026-09-26-latest/part_07.b64 >> /tmp/candidate.b64\n          wc -c /tmp/candidate.b64\n          base64 --decode /tmp/candidate.b64 > /tmp/candidate.tar.xz\n          echo "candidate_decode_rc=$?"\n          xz -t /tmp/candidate.tar.xz\n          echo "candidate_xz_rc=$?"\n          tar -tJf /tmp/candidate.tar.xz | head -120 || true
          if [ "$rc" -eq 0 ]; then
            wc -c /tmp/latest.tar.xz
            sha256sum /tmp/latest.tar.xz
            tar -tJf /tmp/latest.tar.xz | head -120
          fi
