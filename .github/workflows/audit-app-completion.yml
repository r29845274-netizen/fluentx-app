name: FluentX Completion Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-app-completion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract source
        run: |
          rm -rf fluentx_admin_secure
          unzip -q fluentx_mobile_test_ready.zip

      - name: Apply current build patches
        run: |
          python3 scripts/ci_patch.py fluentx_admin_secure
          python3 scripts/patch_splash_redirect.py fluentx_admin_secure
          python3 scripts/patch_personalized_onboarding.py fluentx_admin_secure
          python3 scripts/fix_personalized_onboarding_compile.py fluentx_admin_secure
          python3 scripts/patch_full_placement_test_ui.py fluentx_admin_secure
          python3 scripts/patch_learning_path_minimal.py fluentx_admin_secure
          python3 scripts/patch_market_ready_completion.py fluentx_admin_secure
          python3 scripts/patch_learning_path_detail.py fluentx_admin_secure
          python3 scripts/patch_fluentx_visual_system.py fluentx_admin_secure
          python3 scripts/patch_reference_uiux.py fluentx_admin_secure

      - name: Build completion audit
        run: |
          mkdir -p diagnostics
          {
            echo '=== DART FILE TREE ==='
            find fluentx_admin_secure/lib -type f -name '*.dart' | sort
            echo
            echo '=== INCOMPLETE / PLACEHOLDER SIGNALS ==='
            grep -RniE -C 3 'TODO|FIXME|placeholder|coming soon|not implemented|not available yet|mock|dummy|stub|under construction' fluentx_admin_secure/lib || true
            echo
            echo '=== INTERVIEW / SPEAKING ==='
            grep -RniE -C 3 'interview|speaking|pronunciation' fluentx_admin_secure/lib || true
            echo
            echo '=== PROGRESS / GOALS / ACHIEVEMENTS ==='
            grep -RniE -C 3 'progress|daily goal|achievement|streak|Communication DNA' fluentx_admin_secure/lib || true
            echo
            echo '=== PROFILE / SETTINGS / DELETE ACCOUNT ==='
            grep -RniE -C 3 'profile|settings|delete account|delete-account|privacy|terms' fluentx_admin_secure/lib || true
            echo
            echo '=== BILLING / SUBSCRIPTION ==='
            grep -RniE -C 3 'RevenueCat|Purchases|purchase|subscription|billing|paywall|entitlement' fluentx_admin_secure/lib fluentx_admin_secure/pubspec.yaml || true
            echo
            echo '=== ROUTES ==='
            grep -RniE -C 2 'GoRoute|RoutePaths|path:' fluentx_admin_secure/lib/core fluentx_admin_secure/lib || true
          } > diagnostics/app_completion_audit.txt

      - name: Save audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/app_completion_audit.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save FluentX completion audit [skip ci]"
            git push
          fi
