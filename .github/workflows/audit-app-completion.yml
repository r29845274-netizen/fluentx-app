name: FluentX Completion Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-app-completion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract source
        run: |
          rm -rf fluentx_admin_secure
          unzip -q fluentx_mobile_test_ready.zip

      - name: Apply current production patch stack
        run: |
          python3 scripts/ci_patch.py fluentx_admin_secure
          python3 scripts/patch_splash_redirect.py fluentx_admin_secure
          python3 scripts/patch_personalized_onboarding.py fluentx_admin_secure
          python3 scripts/fix_personalized_onboarding_compile.py fluentx_admin_secure
          python3 scripts/patch_full_placement_test_ui.py fluentx_admin_secure
          python3 scripts/patch_learning_path_minimal.py fluentx_admin_secure
          python3 scripts/patch_market_ready_completion.py fluentx_admin_secure
          python3 scripts/patch_learning_path_detail.py fluentx_admin_secure
          python3 scripts/patch_fluentx_visual_system.py fluentx_admin_secure
          python3 scripts/patch_reference_uiux.py fluentx_admin_secure
          python3 scripts/patch_interview_ai_coach.py fluentx_admin_secure
          python3 scripts/patch_settings_security.py fluentx_admin_secure
          python3 scripts/patch_revenuecat_production.py fluentx_admin_secure
          python3 scripts/patch_production_readiness.py fluentx_admin_secure
          python3 scripts/patch_release_readiness.py fluentx_admin_secure
          python3 scripts/patch_final_ui_cleanup.py fluentx_admin_secure
          python3 scripts/patch_final_visual_consistency.py fluentx_admin_secure
          python3 scripts/patch_billing_compliance.py fluentx_admin_secure
          python3 scripts/patch_certificates.py fluentx_admin_secure
          python3 scripts/patch_membership_tiers.py fluentx_admin_secure
          python3 scripts/patch_subscription_feature_gating.py fluentx_admin_secure
          python3 scripts/patch_launch_runtime_completion.py fluentx_admin_secure

      - name: Build completion audit
        run: |
          mkdir -p diagnostics/source_snapshots
          {
            echo '=== DART FILE TREE ==='
            find fluentx_admin_secure/lib -type f -name '*.dart' | sort
            echo
            echo '=== INCOMPLETE / PLACEHOLDER SIGNALS ==='
            grep -RniE -C 3 'TODO|FIXME|placeholder|coming soon|not implemented|not available yet|mock|dummy|stub|under construction' fluentx_admin_secure/lib || true
            echo
            echo '=== DISABLED INTERACTIONS ==='
            grep -RniE -C 2 'onPressed:[[:space:]]*null|onTap:[[:space:]]*null|enabled:[[:space:]]*false' fluentx_admin_secure/lib || true
            echo
            echo '=== HARDCODED DEMO SIGNALS ==='
            grep -RniE -C 2 'demo|sample|example|static' fluentx_admin_secure/lib/features || true
          } > diagnostics/app_completion_audit.txt

          cp fluentx_admin_secure/lib/main.dart diagnostics/source_snapshots/main.dart.txt
          cp fluentx_admin_secure/lib/app/app.dart diagnostics/source_snapshots/app.dart.txt
          cp fluentx_admin_secure/lib/core/config/env_config.dart diagnostics/source_snapshots/env_config.dart.txt
          cp fluentx_admin_secure/lib/routes/app_router.dart diagnostics/source_snapshots/app_router.dart.txt
          cp fluentx_admin_secure/lib/routes/route_paths.dart diagnostics/source_snapshots/route_paths.dart.txt
          cp fluentx_admin_secure/lib/core/router/bootstrap_screen.dart diagnostics/source_snapshots/bootstrap_screen.dart.txt
          cp fluentx_admin_secure/lib/shared/widgets/navigation/app_shell.dart diagnostics/source_snapshots/app_shell.dart.txt
          cp fluentx_admin_secure/lib/shared/widgets/navigation/app_bottom_nav_bar.dart diagnostics/source_snapshots/app_bottom_nav_bar.dart.txt
          cp fluentx_admin_secure/lib/features/home/presentation/screens/home_screen.dart diagnostics/source_snapshots/home_screen.dart.txt
          cp fluentx_admin_secure/lib/features/learn/presentation/screens/learn_hub_screen.dart diagnostics/source_snapshots/learn_hub_screen.dart.txt
          cp fluentx_admin_secure/lib/features/learn/presentation/screens/learning_path_screen.dart diagnostics/source_snapshots/learning_path_screen.dart.txt
          cp fluentx_admin_secure/lib/features/ai_practice/presentation/screens/ai_practice_hub_screen.dart diagnostics/source_snapshots/ai_practice_hub_screen.dart.txt
          cp fluentx_admin_secure/lib/features/ai_practice/application/providers/ai_practice_providers.dart diagnostics/source_snapshots/ai_practice_providers.dart.txt 2>/dev/null || true
          cp fluentx_admin_secure/lib/features/ai_practice/data/datasources/ai_practice_remote_datasource.dart diagnostics/source_snapshots/ai_practice_remote_datasource.dart.txt 2>/dev/null || true
          cp fluentx_admin_secure/lib/features/ai_practice/data/repositories/ai_practice_repository_impl.dart diagnostics/source_snapshots/ai_practice_repository_impl.dart.txt 2>/dev/null || true
          cp fluentx_admin_secure/lib/features/ai_practice/domain/entities/practice_message.dart diagnostics/source_snapshots/practice_message.dart.txt 2>/dev/null || true
          cp fluentx_admin_secure/lib/features/ai_practice/domain/entities/practice_scenario.dart diagnostics/source_snapshots/practice_scenario.dart.txt 2>/dev/null || true
          cp fluentx_admin_secure/lib/features/ai_practice/presentation/widgets/chat_bubble.dart diagnostics/source_snapshots/chat_bubble.dart.txt 2>/dev/null || true
          cp fluentx_admin_secure/lib/features/ai_practice/presentation/widgets/practice_mic_button.dart diagnostics/source_snapshots/practice_mic_button.dart.txt 2>/dev/null || true
          cp fluentx_admin_secure/lib/features/ai_practice/presentation/widgets/practice_summary_view.dart diagnostics/source_snapshots/practice_summary_view.dart.txt 2>/dev/null || true
          cp fluentx_admin_secure/lib/features/vocabulary/presentation/screens/vocabulary_screen.dart diagnostics/source_snapshots/vocabulary_screen.dart.txt
          cp fluentx_admin_secure/lib/features/grammar/presentation/screens/grammar_screen.dart diagnostics/source_snapshots/grammar_screen.dart.txt
          cp fluentx_admin_secure/lib/features/listening/presentation/screens/listening_screen.dart diagnostics/source_snapshots/listening_screen.dart.txt
          cp fluentx_admin_secure/lib/features/writing/presentation/screens/writing_screen.dart diagnostics/source_snapshots/writing_screen.dart.txt
          cp fluentx_admin_secure/lib/features/interview_prep/presentation/screens/interview_prep_screen.dart diagnostics/source_snapshots/interview_prep_screen.dart.txt
          cp fluentx_admin_secure/lib/features/progress/presentation/screens/progress_screen.dart diagnostics/source_snapshots/progress_screen.dart.txt
          cp fluentx_admin_secure/lib/features/achievements/presentation/screens/achievements_screen.dart diagnostics/source_snapshots/achievements_screen.dart.txt
          cp fluentx_admin_secure/lib/features/certificates/presentation/screens/certificates_screen.dart diagnostics/source_snapshots/certificates_screen.dart.txt
          cp fluentx_admin_secure/lib/features/communication_dna/presentation/screens/communication_dna_screen.dart diagnostics/source_snapshots/communication_dna_screen.dart.txt
          cp fluentx_admin_secure/lib/features/profile/presentation/screens/profile_screen.dart diagnostics/source_snapshots/profile_screen.dart.txt
          cp fluentx_admin_secure/lib/features/profile/presentation/screens/daily_goals_screen.dart diagnostics/source_snapshots/daily_goals_screen.dart.txt
          cp fluentx_admin_secure/lib/features/profile/presentation/screens/help_support_screen.dart diagnostics/source_snapshots/help_support_screen.dart.txt
          cp fluentx_admin_secure/lib/features/settings/presentation/screens/settings_screen.dart diagnostics/source_snapshots/settings_screen.dart.txt
          cp fluentx_admin_secure/lib/features/settings/presentation/screens/edit_profile_screen.dart diagnostics/source_snapshots/edit_profile_screen.dart.txt
          cp fluentx_admin_secure/lib/features/settings/presentation/screens/legal_document_screen.dart diagnostics/source_snapshots/legal_document_screen.dart.txt
          cp fluentx_admin_secure/lib/features/premium/application/providers/purchase_providers.dart diagnostics/source_snapshots/purchase_providers.dart.txt
          cp fluentx_admin_secure/lib/features/premium/application/providers/membership_identity_provider.dart diagnostics/source_snapshots/membership_identity_provider.dart.txt
          cp fluentx_admin_secure/lib/features/premium/presentation/widgets/membership_identity_card.dart diagnostics/source_snapshots/membership_identity_card.dart.txt
          cp fluentx_admin_secure/lib/features/premium/data/datasources/purchase_remote_datasource.dart diagnostics/source_snapshots/purchase_remote_datasource.dart.txt
          cp fluentx_admin_secure/lib/features/premium/data/repositories/purchase_repository_impl.dart diagnostics/source_snapshots/purchase_repository_impl.dart.txt
          cp fluentx_admin_secure/lib/features/premium/presentation/screens/premium_screen.dart diagnostics/source_snapshots/premium_screen.dart.txt
          cp fluentx_admin_secure/pubspec.yaml diagnostics/source_snapshots/pubspec.yaml.txt

      - name: Save audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics
          if ! git diff --cached --quiet; then
            git commit -m "Save FluentX final UI snapshots [skip ci]"
            git push
          fi
