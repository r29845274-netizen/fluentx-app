name: FluentX APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Extract source
        run: |
          rm -rf fluentx_admin_secure
          unzip -q fluentx_mobile_test_ready.zip

      - name: Export configured Supabase project ref
        run: |
          mkdir -p diagnostics
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('fluentx_admin_secure')
          refs = set()
          pattern = re.compile(r'https://([a-z0-9]{10,})\.supabase\.co', re.I)

          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(errors='ignore')
              except Exception:
                  continue
              refs.update(match.group(1) for match in pattern.finditer(text))

          output = Path('diagnostics/supabase_project_refs.txt')
          output.write_text('\n'.join(sorted(refs)) + ('\n' if refs else ''))
          print('Supabase project refs found:', ', '.join(sorted(refs)) or 'none')
          PY

      - name: Apply compatibility patch
        run: python3 scripts/ci_patch.py fluentx_admin_secure

      - name: Fix splash routing
        run: python3 scripts/patch_splash_redirect.py fluentx_admin_secure

      - name: Apply personalized onboarding
        run: python3 scripts/patch_personalized_onboarding.py fluentx_admin_secure

      - name: Fix personalized onboarding compile imports
        run: python3 scripts/fix_personalized_onboarding_compile.py fluentx_admin_secure

      - name: Apply full placement test UI
        run: python3 scripts/patch_full_placement_test_ui.py fluentx_admin_secure

      - name: Apply conservative personalized learning path
        run: python3 scripts/patch_learning_path_minimal.py fluentx_admin_secure

      - name: Apply market-ready backend and content
        run: python3 scripts/patch_market_ready_completion.py fluentx_admin_secure

      - name: Export canonical Supabase backend sources
        run: |
          rm -rf backend_export
          mkdir -p backend_export
          cp -R fluentx_admin_secure/supabase/. backend_export/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend_export diagnostics/supabase_project_refs.txt
          if ! git diff --cached --quiet; then
            git commit -m "Export canonical Supabase backend sources and project ref [skip ci]"
            git push
          fi

      - name: Apply detailed learning path screen
        run: python3 scripts/patch_learning_path_detail.py fluentx_admin_secure

      - name: Apply FluentX premium visual system
        run: python3 scripts/patch_fluentx_visual_system.py fluentx_admin_secure

      - name: Apply reference-inspired full app UI UX
        run: python3 scripts/patch_reference_uiux.py fluentx_admin_secure

      - name: Validate pubspec
        working-directory: fluentx_admin_secure
        run: flutter pub get

      - name: Source preflight
        working-directory: fluentx_admin_secure
        run: python3 scripts/preflight_check.py

      - name: Bootstrap Android
        working-directory: fluentx_admin_secure
        run: bash scripts/bootstrap_android.sh

      - name: Enable Android core library desugaring
        run: python3 scripts/patch_android_desugaring.py fluentx_admin_secure

      - name: Remove generated template test
        run: rm -f fluentx_admin_secure/test/widget_test.dart

      - name: Install dependencies
        working-directory: fluentx_admin_secure
        run: flutter pub get

      - name: Generate code
        working-directory: fluentx_admin_secure
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze full source
        working-directory: fluentx_admin_secure
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: fluentx_admin_secure
        run: flutter test

      - name: Build debug APK
        working-directory: fluentx_admin_secure
        run: flutter build apk --debug --dart-define=FLAVOR=dev

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: FluentX-debug-apk
          path: fluentx_admin_secure/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: FluentX-failure-diagnostics
          path: |
            fluentx_admin_secure/pubspec.yaml
            fluentx_admin_secure/pubspec.lock
            diagnostics/supabase_project_refs.txt
          if-no-files-found: ignore
