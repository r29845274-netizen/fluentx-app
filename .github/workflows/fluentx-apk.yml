name: FluentX APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare diagnostics
        run: |
          mkdir -p diagnostics/ci
          echo "checkout=ok" > diagnostics/ci/progress.log

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter primary
        id: flutter_primary
        continue-on-error: true
        timeout-minutes: 8
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Fallback Flutter install
        if: steps.flutter_primary.outcome != 'success'
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -o pipefail
          echo "flutter_primary=failed; using fallback" | tee -a diagnostics/ci/progress.log
          rm -rf "$HOME/flutter"
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter" 2>&1 | tee diagnostics/ci/flutter_fallback_clone.log
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/flutter/bin:$PATH"
          flutter --version 2>&1 | tee diagnostics/ci/flutter_fallback_version.log

      - name: Build FluentX APK with exact diagnostics
        id: build
        continue-on-error: true
        timeout-minutes: 60
        shell: bash
        run: |
          set +e
          mkdir -p diagnostics/ci

          stage() {
            name="$1"
            shift
            echo "START:$name" | tee -a diagnostics/ci/progress.log
            "$@" >"diagnostics/ci/${name}.log" 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "FAILED:$name:$rc" | tee -a diagnostics/ci/progress.log
              echo "$name" > diagnostics/ci/failed_stage.txt
              tail -n 120 "diagnostics/ci/${name}.log" > diagnostics/ci/failure_tail.txt || true
              exit $rc
            fi
            echo "OK:$name" | tee -a diagnostics/ci/progress.log
          }

          if ! command -v flutter >/dev/null 2>&1; then
            echo "FAILED:flutter_setup:127" | tee -a diagnostics/ci/progress.log
            echo "flutter_setup" > diagnostics/ci/failed_stage.txt
            echo "flutter command not found after primary and fallback setup" > diagnostics/ci/failure_tail.txt
            exit 127
          fi

          stage flutter_version flutter --version
          stage extract bash -lc 'rm -rf fluentx_admin_secure && unzip -q fluentx_mobile_test_ready.zip'

          stage patch_stack bash -lc '
            python3 scripts/ci_patch.py fluentx_admin_secure &&
            python3 scripts/patch_splash_redirect.py fluentx_admin_secure &&
            python3 scripts/patch_personalized_onboarding.py fluentx_admin_secure &&
            python3 scripts/fix_personalized_onboarding_compile.py fluentx_admin_secure &&
            python3 scripts/patch_full_placement_test_ui.py fluentx_admin_secure &&
            python3 scripts/patch_learning_path_minimal.py fluentx_admin_secure &&
            python3 scripts/patch_market_ready_completion.py fluentx_admin_secure &&
            python3 scripts/patch_learning_path_detail.py fluentx_admin_secure &&
            python3 scripts/patch_fluentx_visual_system.py fluentx_admin_secure &&
            python3 scripts/patch_reference_uiux.py fluentx_admin_secure &&
            python3 scripts/patch_interview_ai_coach.py fluentx_admin_secure &&
            python3 scripts/patch_settings_security.py fluentx_admin_secure &&
            python3 scripts/patch_revenuecat_production.py fluentx_admin_secure &&
            python3 scripts/patch_release_readiness.py fluentx_admin_secure &&
            python3 scripts/patch_final_ui_cleanup.py fluentx_admin_secure &&
            python3 scripts/patch_final_visual_consistency.py fluentx_admin_secure &&
            python3 scripts/patch_billing_compliance.py fluentx_admin_secure &&
            python3 scripts/patch_certificates.py fluentx_admin_secure &&
            python3 scripts/patch_membership_tiers.py fluentx_admin_secure &&
            python3 scripts/patch_subscription_feature_gating.py fluentx_admin_secure &&
            python3 scripts/patch_launch_runtime_completion.py fluentx_admin_secure &&
            python3 scripts/patch_maya_ai_conversation.py fluentx_admin_secure &&
            python3 scripts/fix_maya_compile.py fluentx_admin_secure &&
            python3 scripts/patch_growth_coaching.py fluentx_admin_secure &&
            python3 scripts/patch_maya_natural_voice.py fluentx_admin_secure &&
            python3 scripts/patch_referral_growth.py fluentx_admin_secure &&
            python3 scripts/patch_growth_analytics_share_cards.py fluentx_admin_secure &&
            python3 scripts/patch_full_legal_compliance.py fluentx_admin_secure &&
            python3 scripts/patch_adaptive_coaching_intelligence.py fluentx_admin_secure
          '

          stage preflight bash -lc 'cd fluentx_admin_secure && python3 scripts/preflight_check.py'
          stage bootstrap_android bash -lc 'cd fluentx_admin_secure && bash -x scripts/bootstrap_android.sh'
          stage desugaring python3 scripts/patch_android_desugaring.py fluentx_admin_secure
          rm -f fluentx_admin_secure/test/widget_test.dart
          stage pub_get bash -lc 'cd fluentx_admin_secure && flutter pub get'
          stage build_runner bash -lc 'cd fluentx_admin_secure && dart run build_runner build --delete-conflicting-outputs'

          flutter analyze --no-fatal-infos --no-fatal-warnings > diagnostics/ci/flutter_analyze.log 2>&1 || true

          stage apk_build bash -lc 'cd fluentx_admin_secure && flutter build apk --debug --dart-define=FLAVOR=dev --dart-define=REVENUECAT_ANDROID_API_KEY="${REVENUECAT_ANDROID_API_KEY:-}"'
          test -s fluentx_admin_secure/build/app/outputs/flutter-apk/app-debug.apk || exit 86
          echo "BUILD_SUCCESS" | tee -a diagnostics/ci/progress.log
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}

      - name: Persist failure diagnostics
        if: steps.build.outcome != 'success'
        continue-on-error: true
        run: |
          set +e
          date -u +"completed_at=%Y-%m-%dT%H:%M:%SZ" >> diagnostics/ci/progress.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f diagnostics/ci
          if ! git diff --cached --quiet; then
            git commit -m "Save exact APK diagnostics [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi

      - name: Upload failure diagnostics
        if: steps.build.outcome != 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: FluentX-ci-diagnostics
          path: diagnostics/ci
          retention-days: 1
          if-no-files-found: warn

      - name: Upload APK
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: fluentx_admin_secure/build/app/outputs/flutter-apk/app-debug.apk
          archive: false
          retention-days: 1
          if-no-files-found: warn

      - name: Confirm successful APK build
        if: steps.build.outcome == 'success'
        run: |
          test -s fluentx_admin_secure/build/app/outputs/flutter-apk/app-debug.apk
          echo "APK compiled successfully. Artifact upload is non-blocking."

      - name: Fail only when APK compilation fails
        if: steps.build.outcome != 'success'
        run: |
          echo "FluentX APK compilation failed."
          cat diagnostics/ci/failed_stage.txt || true
          cat diagnostics/ci/failure_tail.txt || true
          exit 1
