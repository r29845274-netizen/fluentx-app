name: FluentX APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Extract source
        run: |
          rm -rf fluentx_admin_secure
          unzip -q fluentx_mobile_test_ready.zip

      - name: Apply compatibility patch
        run: python3 scripts/ci_patch.py fluentx_admin_secure

      - name: Fix splash routing
        run: python3 scripts/patch_splash_redirect.py fluentx_admin_secure

      - name: Apply personalized onboarding
        run: python3 scripts/patch_personalized_onboarding.py fluentx_admin_secure

      - name: Fix personalized onboarding compile imports
        run: python3 scripts/fix_personalized_onboarding_compile.py fluentx_admin_secure

      - name: Apply full placement test UI
        run: python3 scripts/patch_full_placement_test_ui.py fluentx_admin_secure

      - name: Apply conservative personalized learning path
        run: python3 scripts/patch_learning_path_minimal.py fluentx_admin_secure

      - name: Apply market-ready backend and content
        run: python3 scripts/patch_market_ready_completion.py fluentx_admin_secure

      - name: Apply detailed learning path screen
        run: python3 scripts/patch_learning_path_detail.py fluentx_admin_secure

      - name: Apply FluentX premium visual system
        run: python3 scripts/patch_fluentx_visual_system.py fluentx_admin_secure

      - name: Apply reference-inspired full app UI UX
        run: python3 scripts/patch_reference_uiux.py fluentx_admin_secure

      - name: Apply AI Interview Coach
        run: python3 scripts/patch_interview_ai_coach.py fluentx_admin_secure

      - name: Apply settings security polish
        run: python3 scripts/patch_settings_security.py fluentx_admin_secure

      - name: Apply RevenueCat production bootstrap
        run: python3 scripts/patch_revenuecat_production.py fluentx_admin_secure

      - name: Apply release-readiness polish
        run: python3 scripts/patch_release_readiness.py fluentx_admin_secure

      - name: Apply final UI cleanup
        run: python3 scripts/patch_final_ui_cleanup.py fluentx_admin_secure

      - name: Apply final visual consistency polish
        run: python3 scripts/patch_final_visual_consistency.py fluentx_admin_secure

      - name: Apply Google Play billing compliance
        run: python3 scripts/patch_billing_compliance.py fluentx_admin_secure

      - name: Apply course certificates
        run: python3 scripts/patch_certificates.py fluentx_admin_secure

      - name: Apply membership tier identities
        run: python3 scripts/patch_membership_tiers.py fluentx_admin_secure

      - name: Apply subscription feature gating
        run: python3 scripts/patch_subscription_feature_gating.py fluentx_admin_secure

      - name: Apply launch runtime completion
        run: python3 scripts/patch_launch_runtime_completion.py fluentx_admin_secure

      - name: Apply Maya AI conversation
        run: python3 scripts/patch_maya_ai_conversation.py fluentx_admin_secure

      - name: Apply Maya compile safety fixes
        run: python3 scripts/fix_maya_compile.py fluentx_admin_secure

      - name: Validate pubspec
        working-directory: fluentx_admin_secure
        run: flutter pub get

      - name: Source preflight
        working-directory: fluentx_admin_secure
        run: python3 scripts/preflight_check.py

      - name: Bootstrap Android
        working-directory: fluentx_admin_secure
        run: bash scripts/bootstrap_android.sh

      - name: Normalize Flutter Android toolchain
        run: python3 scripts/patch_android_flutter_compat.py fluentx_admin_secure

      - name: Enable Android core library desugaring
        run: python3 scripts/patch_android_desugaring.py fluentx_admin_secure

      - name: Remove generated template test
        run: rm -f fluentx_admin_secure/test/widget_test.dart

      - name: Install dependencies
        working-directory: fluentx_admin_secure
        run: flutter pub get

      - name: Generate code
        working-directory: fluentx_admin_secure
        run: |
          set -o pipefail
          mkdir -p ../diagnostics/ci
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee ../diagnostics/ci/build_runner.log

      - name: Analyze full source
        working-directory: fluentx_admin_secure
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../diagnostics/ci/flutter_analyze.log

      - name: Run tests
        working-directory: fluentx_admin_secure
        run: |
          set -o pipefail
          flutter test 2>&1 | tee ../diagnostics/ci/flutter_test.log

      - name: Build debug APK
        working-directory: fluentx_admin_secure
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          set -o pipefail
          flutter build apk --debug \
            --dart-define=FLAVOR=dev \
            --dart-define=REVENUECAT_ANDROID_API_KEY=$REVENUECAT_ANDROID_API_KEY \
            2>&1 | tee ../diagnostics/ci/flutter_build_apk.log

      - name: Save exact failure diagnostics
        if: failure()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/ci || true
          if ! git diff --cached --quiet; then
            git commit -m "Save APK failure logs [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: FluentX-debug-apk
          path: fluentx_admin_secure/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: FluentX-failure-diagnostics
          path: |
            diagnostics/ci
            fluentx_admin_secure/pubspec.yaml
            fluentx_admin_secure/pubspec.lock
          if-no-files-found: ignore
