name: FluentX Exact Latest ZIP APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fluentx-exact-latest-apk.yml'
      - '.github/exact-latest-trigger.txt'
  workflow_dispatch:

concurrency:
  group: fluentx-exact-latest-apk-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: false

      - name: Reconstruct exact uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat .source_handoff/2026-10-02-exact-zip/part_*.b64 > /tmp/fluentx_latest.b64
          base64 --decode /tmp/fluentx_latest.b64 > /tmp/fluentx_mobile_test_ready.zip
          echo "8f80dee56074fd7d6e546cfa93669725f021591fe114ae662e6f6a8b8abfbe72  /tmp/fluentx_mobile_test_ready.zip" | sha256sum -c -
          rm -rf fluentx_admin_secure
          unzip -q /tmp/fluentx_mobile_test_ready.zip
          test -f fluentx_admin_secure/pubspec.yaml
          echo "EXACT_ZIP_SHA256=$(sha256sum /tmp/fluentx_mobile_test_ready.zip | awk '{print $1}')"

      - name: Apply compile compatibility only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('fluentx_admin_secure')
          pub = root / 'pubspec.yaml'
          text = pub.read_text()
          text = text.replace('intl: ^0.19.0', 'intl: ^0.20.3')
          text = text.replace('lucide_icons: ^0.257.0', 'lucide_icons_flutter: ^3.1.20')
          text = text.replace('freezed: ^2.5.5', 'freezed: 2.5.2')
          pub.write_text(text)

          for path in (root / 'lib').rglob('*.dart'):
              s = path.read_text()
              s2 = s.replace(
                  "package:lucide_icons/lucide_icons.dart",
                  "package:lucide_icons_flutter/lucide_icons.dart",
              )
              if s2 != s:
                  path.write_text(s2)

          admin = root / 'lib/features/admin/presentation/screens/admin_console_screen.dart'
          if admin.exists():
              s = admin.read_text()
              s = s.replace(
                  '_enrollmentQrCode = enrollment.totp.qrCode;\n'
                  '        _enrollmentSecret = enrollment.totp.secret;',
                  '_enrollmentQrCode = enrollment.totp?.qrCode;\n'
                  '        _enrollmentSecret = enrollment.totp?.secret;\n'
                  "        if (_enrollmentQrCode == null || _enrollmentSecret == null) {\n"
                  "          throw StateError('TOTP enrollment details were not returned.');\n"
                  '        }',
              )
              s = s.replace('Icons.visibility_lock', 'Icons.visibility_off_outlined')
              admin.write_text(s)

          notifications = root / 'lib/core/services/notification_service.dart'
          if notifications.exists():
              s = notifications.read_text()
              needle = '      androidScheduleMode: AndroidScheduleMode.inexactAllowWhileIdle,\n      matchDateTimeComponents: DateTimeComponents.time,'
              repl = (
                  '      androidScheduleMode: AndroidScheduleMode.inexactAllowWhileIdle,\n'
                  '      uiLocalNotificationDateInterpretation: '
                  'UILocalNotificationDateInterpretation.absoluteTime,\n'
                  '      matchDateTimeComponents: DateTimeComponents.time,'
              )
              if needle in s and 'uiLocalNotificationDateInterpretation:' not in s:
                  notifications.write_text(s.replace(needle, repl))

          # Remove the deleted/foreign Supabase project fallback. The real project
          # is injected below with dart-defines.
          env_config = root / 'lib/core/config/env_config.dart'
          env_text = env_config.read_text()
          env_text = env_text.replace(
              "defaultValue: 'https://ampcghxowbeocfqqnnvk.supabase.co',",
              "defaultValue: '',",
          )
          env_text = env_text.replace(
              "defaultValue: 'sb_publishable_TF58ThseSYp-CERYJklnbA_PL_F_rGo',",
              "defaultValue: '',",
          )
          env_config.write_text(env_text)

          # Keep Failure.uiMessage in UI files and make sure its extension is imported.
          for path in (root / 'lib').rglob('*.dart'):
              s = path.read_text()
              if '.uiMessage' in s and "core/error/failures.dart" not in s and path.name != 'failures.dart':
                  s = "import 'package:fluentx/core/error/failures.dart';\n" + s
                  path.write_text(s)

          # Convert low-level network exceptions into a domain NetworkFailure.
          datasource = root / 'lib/features/authentication/data/datasources/auth_remote_datasource.dart'
          ds = datasource.read_text()
          helper = """
Exception _mapAuthInfrastructureException(Object error) {
  final message = error.toString();
  final lower = message.toLowerCase();
  if (lower.contains('socketexception') ||
      lower.contains('failed host lookup') ||
      lower.contains('clientexception') ||
      lower.contains('network is unreachable') ||
      lower.contains('connection refused') ||
      lower.contains('connection reset') ||
      lower.contains('connection timed out')) {
    return const NetworkException(
      'Unable to connect to FluentX. Check your internet connection and try again.',
    );
  }
  return ServerException(message);
}

"""
          if '_mapAuthInfrastructureException' not in ds:
              marker = 'abstract class AuthRemoteDataSource {'
              ds = ds.replace(marker, helper + marker)
          ds = ds.replace('throw ServerException(e.toString());', 'throw _mapAuthInfrastructureException(e);')
          datasource.write_text(ds)

          repo_file = root / 'lib/features/authentication/data/repositories/auth_repository_impl.dart'
          rs = repo_file.read_text()
          server_catch = """    } on ServerException catch (e) {
      return left(Failure.server(message: e.message));
"""
          network_then_server = """    } on NetworkException catch (e) {
      return left(Failure.network(message: e.message));
    } on ServerException catch (e) {
      return left(Failure.server(message: e.message));
"""
          rs = rs.replace(server_catch, network_then_server)
          repo_file.write_text(rs)

          # Server errors shown in the UI are generic; auth/network messages stay useful.
          failures = root / 'lib/core/error/failures.dart'
          fs = failures.read_text()
          fs = fs.replace(
              'ServerFailure(:final message) => message,',
              "ServerFailure() => 'Something went wrong. Please try again.',",
          )
          failures.write_text(fs)

          # Regression test for the exact screenshot class of failure.
          test = root / 'test/core/error/failures_test.dart'
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text("""import 'package:flutter_test/flutter_test.dart';
import 'package:fluentx/core/error/failures.dart';

void main() {
  test('network failure exposes only a friendly UI message', () {
    const failure = Failure.network(
      message: 'Unable to connect to FluentX. Check your internet connection and try again.',
    );
    expect(failure.uiMessage, contains('Unable to connect to FluentX'));
    expect(failure.uiMessage, isNot(contains('supabase.co')));
    expect(failure.uiMessage, isNot(contains('SocketException')));
  });

  test('server failure does not leak internal details', () {
    const failure = Failure.server(
      message: "ClientException with SocketException: Failed host lookup: bad.supabase.co",
    );
    expect(failure.uiMessage, 'Something went wrong. Please try again.');
    expect(failure.uiMessage, isNot(contains('supabase.co')));
  });
}
""")
          print('compile compatibility + Supabase runtime fixes applied')
          PY

      - name: Preflight
        working-directory: fluentx_admin_secure
        run: python3 scripts/preflight_check.py

      - name: Bootstrap Android
        working-directory: fluentx_admin_secure
        run: bash scripts/bootstrap_android.sh

      - name: Apply Android desugaring
        run: python3 scripts/patch_android_desugaring.py fluentx_admin_secure

      - name: Install dependencies
        working-directory: fluentx_admin_secure
        run: flutter pub get

      - name: Generate code
        working-directory: fluentx_admin_secure
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Test auth error handling
        working-directory: fluentx_admin_secure
        run: flutter test test/core/error/failures_test.dart

      - name: Build debug APK
        working-directory: fluentx_admin_secure
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          flutter build apk --debug \
            --dart-define=FLAVOR=dev \
            --dart-define=SUPABASE_URL=https://fkrxqysdcrgwjarezsmd.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=sb_publishable_0s_nQk6ksSLDhgLiiaPg4w_g_WOsoBu \
            --dart-define=REVENUECAT_ANDROID_API_KEY="${REVENUECAT_ANDROID_API_KEY:-}"

      - name: Verify APK
        run: |
          test -s fluentx_admin_secure/build/app/outputs/flutter-apk/app-debug.apk
          cp fluentx_admin_secure/build/app/outputs/flutter-apk/app-debug.apk FluentX-exact-latest-debug.apk
          sha256sum FluentX-exact-latest-debug.apk | tee FluentX-exact-latest-debug.sha256
          stat -c 'APK_BYTES=%s' FluentX-exact-latest-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: FluentX-exact-latest-debug-apk
          path: |
            FluentX-exact-latest-debug.apk
            FluentX-exact-latest-debug.sha256
          retention-days: 7
          if-no-files-found: error
