name: FluentX Uptime Monitor
on:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/uptime-monitor.yml'
      - '.github/uptime-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check health endpoints
        id: health
        run: |
          set -euo pipefail
          base='https://rdrvqszejpupaqeitmmu.supabase.co/functions/v1/health'
          curl --fail --silent --show-error --max-time 10 "$base/live"
          curl --fail --silent --show-error --max-time 10 "$base"
      - name: Open incident issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'ALERT: FluentX production health check failed';
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            if (!issues.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  'Automated production health check failed.',
                  '',
                  'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
                  '',
                  'Follow docs/runbooks/incident.md.',
                ].join('\n'),
              });
            }
