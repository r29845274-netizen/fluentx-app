name: FluentX Production AAB

on:
  workflow_dispatch:

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate required release secrets
        env:
          KEYSTORE_B64: ${{ secrets.FLUENTX_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.FLUENTX_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FLUENTX_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLUENTX_UPLOAD_KEY_ALIAS }}
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: |
          test -n "$KEYSTORE_B64" || (echo 'Missing FLUENTX_UPLOAD_KEYSTORE_B64' && exit 1)
          test -n "$STORE_PASSWORD" || (echo 'Missing FLUENTX_UPLOAD_STORE_PASSWORD' && exit 1)
          test -n "$KEY_PASSWORD" || (echo 'Missing FLUENTX_UPLOAD_KEY_PASSWORD' && exit 1)
          test -n "$KEY_ALIAS" || (echo 'Missing FLUENTX_UPLOAD_KEY_ALIAS' && exit 1)
          test -n "$REVENUECAT_ANDROID_API_KEY" || (echo 'Missing REVENUECAT_ANDROID_API_KEY' && exit 1)

      - name: Extract source
        run: |
          rm -rf fluentx_admin_secure
          unzip -q fluentx_mobile_test_ready.zip

      - name: Apply production patches
        run: |
          python3 scripts/ci_patch.py fluentx_admin_secure
          python3 scripts/patch_splash_redirect.py fluentx_admin_secure
          python3 scripts/patch_personalized_onboarding.py fluentx_admin_secure
          python3 scripts/fix_personalized_onboarding_compile.py fluentx_admin_secure
          python3 scripts/patch_full_placement_test_ui.py fluentx_admin_secure
          python3 scripts/patch_learning_path_minimal.py fluentx_admin_secure
          python3 scripts/patch_market_ready_completion.py fluentx_admin_secure
          python3 scripts/patch_learning_path_detail.py fluentx_admin_secure
          python3 scripts/patch_fluentx_visual_system.py fluentx_admin_secure
          python3 scripts/patch_reference_uiux.py fluentx_admin_secure
          python3 scripts/patch_interview_ai_coach.py fluentx_admin_secure
          python3 scripts/patch_settings_security.py fluentx_admin_secure
          python3 scripts/patch_revenuecat_production.py fluentx_admin_secure
          python3 scripts/patch_production_readiness.py fluentx_admin_secure
          python3 scripts/patch_release_readiness.py fluentx_admin_secure
          python3 scripts/patch_final_ui_cleanup.py fluentx_admin_secure
          python3 scripts/patch_final_visual_consistency.py fluentx_admin_secure
          python3 scripts/patch_billing_compliance.py fluentx_admin_secure
          python3 scripts/patch_certificates.py fluentx_admin_secure
          python3 scripts/patch_membership_tiers.py fluentx_admin_secure
          python3 scripts/patch_subscription_feature_gating.py fluentx_admin_secure
          python3 scripts/patch_launch_runtime_completion.py fluentx_admin_secure
          python3 scripts/patch_maya_ai_conversation.py fluentx_admin_secure
          python3 scripts/fix_maya_compile.py fluentx_admin_secure
          python3 scripts/patch_growth_coaching.py fluentx_admin_secure
          python3 scripts/patch_maya_natural_voice.py fluentx_admin_secure
          python3 scripts/patch_referral_growth.py fluentx_admin_secure
          python3 scripts/patch_growth_analytics_share_cards.py fluentx_admin_secure
          python3 scripts/patch_full_legal_compliance.py fluentx_admin_secure
          python3 scripts/patch_adaptive_coaching_intelligence.py fluentx_admin_secure
          python3 scripts/patch_onboarding_runtime_null.py fluentx_admin_secure

      - name: Install dependencies
        working-directory: fluentx_admin_secure
        timeout-minutes: 10
        run: flutter pub get

      - name: Source preflight
        working-directory: fluentx_admin_secure
        run: python3 scripts/preflight_check.py

      - name: Bootstrap Android
        working-directory: fluentx_admin_secure
        timeout-minutes: 10
        run: bash scripts/bootstrap_android.sh

      - name: Apply Android release config
        run: |
          python3 scripts/patch_android_desugaring.py fluentx_admin_secure
          python3 scripts/patch_android_release.py fluentx_admin_secure

      - name: Configure upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.FLUENTX_UPLOAD_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.FLUENTX_UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FLUENTX_UPLOAD_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLUENTX_UPLOAD_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > fluentx_admin_secure/android/app/upload-keystore.jks
          cat > fluentx_admin_secure/android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Remove generated template test
        run: rm -f fluentx_admin_secure/test/widget_test.dart

      - name: Generate code
        working-directory: fluentx_admin_secure
        timeout-minutes: 12
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze release source
        working-directory: fluentx_admin_secure
        timeout-minutes: 12
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests if present
        working-directory: fluentx_admin_secure
        timeout-minutes: 10
        run: |
          if find test -type f -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo 'No Dart tests present; skipping flutter test.'
          fi

      - name: Build production AAB
        working-directory: fluentx_admin_secure
        timeout-minutes: 35
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
        run: >-
          flutter build appbundle --release
          --dart-define=FLAVOR=prod
          --dart-define=REVENUECAT_ANDROID_API_KEY=$REVENUECAT_ANDROID_API_KEY

      - name: Upload production AAB
        uses: actions/upload-artifact@v7
        with:
          name: FluentX-production-aab
          path: fluentx_admin_secure/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
