workflows:
  fluentx-mobile-test-apk:
    name: FluentX — Mobile Test APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable

    scripts:
      - name: Extract FluentX source
        script: |
          rm -rf fluentx_admin_secure
          unzip -q fluentx_mobile_test_ready.zip

      - name: Apply dependency and source fixes
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('fluentx_admin_secure')

          def replace(rel, old, new):
              path = root / rel
              if not path.exists():
                  return
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new))

          pubspec = root / 'pubspec.yaml'
          text = pubspec.read_text()
          text = text.replace('purchases_flutter: ^7.28.0 # RevenueCat', 'purchases_flutter: 10.5.0 # RevenueCat')
          text = text.replace('intl: ^0.19.0', 'intl: ^0.20.3')
          text = text.replace('build_runner: ^2.4.11', 'build_runner: 2.4.11')
          text = text.replace('freezed: ^2.5.5', 'freezed: 2.5.2')
          text = re.sub(r'(?m)^\s*lucide_icons:\s*\^?0\.257\.0\s*\n?', '', text)
          text = re.sub(r'(?m)^\s*flutter_lucide:\s*\^?[0-9.]+\s*\n?', '', text)
          for unused in (
              '  riverpod_generator: ^2.4.0\n',
              '  json_serializable: ^6.8.0\n',
              '  hive_generator: ^2.0.1\n',
          ):
              text = text.replace(unused, '')
          pubspec.write_text(text)

          # RevenueCat 10.x API.
          purchase = root / 'lib/features/premium/data/datasources/purchase_remote_datasource.dart'
          code = purchase.read_text()
          code = code.replace(
              'final result = await Purchases.purchasePackage(package);',
              'final result = await Purchases.purchase(PurchaseParams.package(package));',
          )
          code = code.replace(
              "    } on PurchasesErrorCode catch (e) {\n      throw ServerException(e.toString());\n    } catch (e) {\n      throw ServerException(e.toString());\n    }",
              "    } catch (e) {\n      throw ServerException(e.toString());\n    }",
          )
          purchase.write_text(code)

          # Replace Lucide completely with stable Material icons. This removes the
          # IconData-final-class incompatibility and avoids icon-name drift.
          icon_map = {
              'award': 'workspace_premium_outlined',
              'barChart2': 'bar_chart',
              'bell': 'notifications_none',
              'bookOpen': 'menu_book_outlined',
              'briefcase': 'work_outline',
              'building2': 'business_outlined',
              'check': 'check',
              'checkCircle2': 'check_circle_outline',
              'chevronRight': 'chevron_right',
              'clock': 'schedule',
              'construction': 'construction',
              'crown': 'workspace_premium_outlined',
              'eye': 'visibility_outlined',
              'eyeOff': 'visibility_off_outlined',
              'fileText': 'description_outlined',
              'flame': 'local_fire_department_outlined',
              'footprints': 'directions_walk',
              'graduationCap': 'school_outlined',
              'headphones': 'headphones_outlined',
              'helpCircle': 'help_outline',
              'home': 'home_outlined',
              'inbox': 'inbox_outlined',
              'info': 'info_outline',
              'languages': 'translate',
              'lifeBuoy': 'support_agent',
              'lightbulb': 'lightbulb_outline',
              'lock': 'lock_outline',
              'logOut': 'logout',
              'mailCheck': 'mark_email_read_outlined',
              'messageCircle': 'chat_bubble_outline',
              'messageSquare': 'chat_outlined',
              'mic': 'mic_none',
              'moon': 'dark_mode_outlined',
              'partyPopper': 'celebration_outlined',
              'pause': 'pause',
              'penLine': 'edit_outlined',
              'play': 'play_arrow',
              'playCircle': 'play_circle_outline',
              'refreshCw': 'refresh',
              'rotateCcw': 'replay',
              'search': 'search',
              'settings': 'settings_outlined',
              'shield': 'shield_outlined',
              'smartphone': 'smartphone',
              'sparkles': 'auto_awesome_outlined',
              'spellCheck': 'spellcheck',
              'square': 'crop_square',
              'star': 'star_border',
              'sun': 'light_mode_outlined',
              'target': 'gps_fixed',
              'trash2': 'delete_outline',
              'trophy': 'emoji_events_outlined',
              'user': 'person_outline',
              'userCog': 'manage_accounts_outlined',
              'users': 'group_outlined',
              'wifiOff': 'wifi_off',
              'x': 'close',
          }
          for path in (root / 'lib').rglob('*.dart'):
              code = path.read_text()
              if 'LucideIcons.' not in code and 'lucide_icons' not in code and 'flutter_lucide' not in code:
                  continue
              code = code.replace("import 'package:lucide_icons/lucide_icons.dart';\n", '')
              code = code.replace("import 'package:flutter_lucide/flutter_lucide.dart';\n", '')
              if 'LucideIcons.' in code and "package:flutter/material.dart" not in code:
                  if "import 'package:flutter/widgets.dart';" in code:
                      code = code.replace("import 'package:flutter/widgets.dart';", "import 'package:flutter/material.dart';")
                  else:
                      code = "import 'package:flutter/material.dart';\n" + code
              for old, new in icon_map.items():
                  code = code.replace(f'LucideIcons.{old}', f'Icons.{new}')
              path.write_text(code)

          leftovers = []
          for path in (root / 'lib').rglob('*.dart'):
              code = path.read_text()
              if 'LucideIcons.' in code or 'package:lucide_icons/' in code or 'package:flutter_lucide/' in code:
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Lucide leftovers: ' + ', '.join(leftovers))

          # AI Failure extension import.
          ai_hub = root / 'lib/features/ai_practice/presentation/screens/ai_practice_hub_screen.dart'
          code = ai_hub.read_text()
          marker = "import '../../../../core/constants/app_spacing.dart';\n"
          if "core/error/failures.dart" not in code:
              code = code.replace(marker, marker + "import '../../../../core/error/failures.dart';\n")
          ai_hub.write_text(code)

          # Supabase MFA null-safety.
          admin = root / 'lib/features/admin/presentation/screens/admin_console_screen.dart'
          code = admin.read_text()
          code = code.replace(
              "        _enrollmentFactorId = enrollment.id;\n        _enrollmentQrCode = enrollment.totp.qrCode;\n        _enrollmentSecret = enrollment.totp.secret;",
              "        final totp = enrollment.totp;\n        if (totp == null) {\n          throw const AuthException('Authenticator enrollment did not return TOTP details.');\n        }\n        _enrollmentFactorId = enrollment.id;\n        _enrollmentQrCode = totp.qrCode;\n        _enrollmentSecret = totp.secret;",
          )
          code = code.replace("throw AuthException('No authenticator factor found.');", "throw const AuthException('No authenticator factor found.');")
          code = code.replace('const Icon(Icons.visibility_lock)', 'const Icon(Icons.visibility)')
          admin.write_text(code)

          # flutter_local_notifications 17.x API.
          notifications = root / 'lib/core/services/notification_service.dart'
          code = notifications.read_text()
          marker = '      androidScheduleMode: AndroidScheduleMode.inexactAllowWhileIdle,\n'
          if 'uiLocalNotificationDateInterpretation:' not in code:
              code = code.replace(
                  marker,
                  marker + '      uiLocalNotificationDateInterpretation:\n          UILocalNotificationDateInterpretation.absoluteTime,\n',
              )
          notifications.write_text(code)

          # RevenueCat auth sync return types.
          replace('lib/app/app.dart', 'Purchases.logIn(user.id).catchError((_) {});', 'Purchases.logIn(user.id).then<void>((_) {}, onError: (_, __) {});')
          replace('lib/app/app.dart', 'Purchases.logOut().catchError((_) {});', 'Purchases.logOut().then<void>((_) {}, onError: (_, __) {});')

          # Supabase current API.
          main = root / 'lib/main.dart'
          code = main.read_text().replace("import 'dart:ui';\n\n", '')
          code = code.replace('    anonKey: EnvConfig.supabaseAnonKey,', '    publishableKey: EnvConfig.supabaseAnonKey,')
          main.write_text(code)

          # Safe lint cleanup that previously surfaced.
          replace('lib/features/listening/application/providers/listening_providers.dart', "import '../../../authentication/application/providers/auth_providers.dart';\n", '')
          replace('lib/features/onboarding/application/providers/onboarding_providers.dart', "import '../../../../core/error/failures.dart';\n", '')
          replace('lib/features/authentication/presentation/screens/login_screen.dart', '      context.push(\n', '      await context.push(\n')
          replace('lib/features/authentication/presentation/screens/signup_screen.dart', '    context.push(\n', '    await context.push(\n')
          PY

      - name: Source preflight
        script: cd fluentx_admin_secure && python3 scripts/preflight_check.py

      - name: Bootstrap Android platform
        script: cd fluentx_admin_secure && bash scripts/bootstrap_android.sh

      - name: Remove generated Flutter template test
        script: rm -f fluentx_admin_secure/test/widget_test.dart

      - name: Install dependencies
        script: cd fluentx_admin_secure && flutter pub get

      - name: Generate code
        script: cd fluentx_admin_secure && dart run build_runner build --delete-conflicting-outputs

      - name: Analyze source (informational)
        script: |
          cd fluentx_admin_secure
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          echo "Analyzer exit code: ${PIPESTATUS[0]}"
          set -e
          exit 0

      - name: Run tests
        script: cd fluentx_admin_secure && flutter test

      - name: Build debug APK with root-cause diagnostics
        script: |
          cd fluentx_admin_secure
          set +e
          flutter build apk --debug --dart-define=FLAVOR=dev 2>&1 | tee build-debug.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo ""
            echo "================ ROOT CAUSE SUMMARY ================"
            grep -nE "Error:|FAILURE:|What went wrong:|Execution failed|Caused by:|Exception|Could not|error:" build-debug.log | tail -n 120 || true
            echo "===================================================="
            exit "$BUILD_EXIT"
          fi
          set -e

    artifacts:
      - fluentx_admin_secure/build/app/outputs/flutter-apk/*.apk
      - fluentx_admin_secure/build-debug.log
      - fluentx_admin_secure/analyze.log
